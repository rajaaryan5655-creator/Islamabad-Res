<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" width="800" height="900" role="img" aria-label="Islamabad Restaurant building at night">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#07070a"/>
      <stop offset="60%" stop-color="#101018"/>
      <stop offset="100%" stop-color="#191319"/>
    </linearGradient>
    <linearGradient id="facade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#241a17"/>
      <stop offset="100%" stop-color="#12100f"/>
    </linearGradient>
    <linearGradient id="brick" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5c2620"/>
      <stop offset="100%" stop-color="#331512"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffcd7a" stop-opacity=".95"/>
      <stop offset="100%" stop-color="#e08b2a" stop-opacity=".55"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b1715"/>
      <stop offset="100%" stop-color="#0b0a09"/>
    </linearGradient>
    <radialGradient id="lamp" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd89a" stop-opacity=".85"/>
      <stop offset="100%" stop-color="#ffd89a" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="soft2"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <rect width="800" height="900" fill="url(#sky)"/>
  <!-- distant skyline -->
  <g opacity=".5" fill="#0d0d12">
    <rect x="0" y="180" width="120" height="300"/><rect x="130" y="230" width="80" height="250"/>
    <rect x="620" y="200" width="110" height="280"/><rect x="740" y="250" width="60" height="230"/>
  </g>
  <g fill="#3a3320" opacity=".55">
    <rect x="20" y="220" width="12" height="16"/><rect x="52" y="260" width="12" height="16"/>
    <rect x="88" y="300" width="12" height="16"/><rect x="650" y="240" width="12" height="16"/>
    <rect x="690" y="290" width="12" height="16"/><rect x="756" y="300" width="12" height="16"/>
  </g>

  <!-- main building block -->
  <rect x="60" y="230" width="680" height="470" fill="url(#facade)"/>
  <rect x="60" y="230" width="680" height="26" fill="#2c211c"/>
  <!-- brick band -->
  <rect x="60" y="256" width="680" height="150" fill="url(#brick)"/>
  <g opacity=".22" fill="#000">
    <g>
      <rect x="60" y="278" width="680" height="2"/><rect x="60" y="306" width="680" height="2"/>
      <rect x="60" y="334" width="680" height="2"/><rect x="60" y="362" width="680" height="2"/>
      <rect x="60" y="390" width="680" height="2"/>
    </g>
  </g>
  <g opacity=".18" fill="#000">
    <rect x="120" y="256" width="2" height="150"/><rect x="200" y="256" width="2" height="150"/>
    <rect x="280" y="256" width="2" height="150"/><rect x="360" y="256" width="2" height="150"/>
    <rect x="440" y="256" width="2" height="150"/><rect x="520" y="256" width="2" height="150"/>
    <rect x="600" y="256" width="2" height="150"/><rect x="680" y="256" width="2" height="150"/>
  </g>

  <!-- sign glow -->
  <ellipse cx="400" cy="330" rx="290" ry="70" fill="#c8102e" opacity=".18" filter="url(#soft)"/>
  <!-- signage -->
  <g>
    <text x="400" y="342" text-anchor="middle" font-family="Montserrat, Poppins, Arial, sans-serif" font-size="72" font-weight="800" letter-spacing="4" fill="#ffffff">ISLAMABAD</text>
    <text x="400" y="392" text-anchor="middle" font-family="Montserrat, Poppins, Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="12" fill="#f4b400">RESTAURANT</text>
  </g>

  <!-- awning -->
  <rect x="60" y="410" width="680" height="18" fill="#0e0d0c"/>
  <path d="M60 428 L740 428 L706 470 L94 470 Z" fill="#7e1420"/>
  <g opacity=".35" fill="#000">
    <path d="M170 428 L156 470 L146 470 L160 428 Z"/><path d="M300 428 L290 470 L280 470 L290 428 Z"/>
    <path d="M430 428 L430 470 L420 470 L420 428 Z"/><path d="M560 428 L570 470 L560 470 L550 428 Z"/>
  </g>

  <!-- ground floor glass -->
  <rect x="70" y="470" width="660" height="230" fill="#0b0a0a"/>
  <g>
    <rect x="92" y="486" width="150" height="200" fill="url(#glow)" opacity=".85"/>
    <rect x="256" y="486" width="150" height="200" fill="url(#glow)" opacity=".7"/>
    <rect x="420" y="486" width="120" height="200" fill="url(#glow)" opacity=".8"/>
    <rect x="556" y="486" width="152" height="200" fill="url(#glow)" opacity=".6"/>
  </g>
  <!-- entrance -->
  <rect x="420" y="520" width="120" height="166" fill="#2a1a10" opacity=".55"/>
  <rect x="478" y="520" width="4" height="166" fill="#0a0a0a" opacity=".8"/>
  <!-- mullions -->
  <g fill="#0a0a0a">
    <rect x="242" y="486" width="14" height="200"/><rect x="406" y="486" width="14" height="200"/>
    <rect x="540" y="486" width="16" height="200"/><rect x="70" y="470" width="22" height="230"/>
    <rect x="708" y="470" width="22" height="230"/>
  </g>
  <!-- silhouettes of diners -->
  <g fill="#1b0f07" opacity=".72">
    <circle cx="130" cy="590" r="15"/><rect x="112" y="606" width="36" height="60" rx="12"/>
    <circle cx="190" cy="600" r="13"/><rect x="175" y="614" width="31" height="52" rx="11"/>
    <circle cx="300" cy="596" r="14"/><rect x="283" y="611" width="34" height="56" rx="11"/>
    <circle cx="360" cy="604" r="12"/><rect x="346" y="617" width="29" height="49" rx="10"/>
    <circle cx="620" cy="598" r="14"/><rect x="603" y="613" width="34" height="54" rx="11"/>
    <circle cx="672" cy="606" r="12"/><rect x="658" y="619" width="29" height="47" rx="10"/>
  </g>

  <!-- ground -->
  <rect x="0" y="700" width="800" height="200" fill="url(#ground)"/>
  <rect x="0" y="700" width="800" height="6" fill="#231e1a"/>
  <!-- reflections -->
  <g opacity=".2" filter="url(#soft2)">
    <rect x="92" y="706" width="150" height="90" fill="#f0a94a"/>
    <rect x="256" y="706" width="150" height="70" fill="#f0a94a"/>
    <rect x="420" y="706" width="120" height="100" fill="#f0a94a"/>
    <rect x="556" y="706" width="152" height="60" fill="#f0a94a"/>
  </g>

  <!-- outdoor tables -->
  <g>
    <g transform="translate(150,760)">
      <ellipse cx="0" cy="0" rx="46" ry="12" fill="#1c1614"/>
      <rect x="-3" y="0" width="6" height="42" fill="#141110"/>
      <ellipse cx="0" cy="44" rx="26" ry="7" fill="#141110"/>
      <circle cx="0" cy="-34" r="10" fill="#ffd08a" opacity=".85"/>
      <circle cx="0" cy="-34" r="34" fill="url(#lamp)"/>
    </g>
    <g transform="translate(640,790)">
      <ellipse cx="0" cy="0" rx="52" ry="13" fill="#1c1614"/>
      <rect x="-3" y="0" width="6" height="46" fill="#141110"/>
      <ellipse cx="0" cy="48" rx="28" ry="8" fill="#141110"/>
      <circle cx="0" cy="-36" r="11" fill="#ffd08a" opacity=".85"/>
      <circle cx="0" cy="-36" r="38" fill="url(#lamp)"/>
    </g>
  </g>
  <!-- street lamp light pools -->
  <ellipse cx="400" cy="760" rx="230" ry="60" fill="#ffb45e" opacity=".08" filter="url(#soft)"/>
  <!-- vignette -->
  <rect width="800" height="900" fill="none"/>
  <rect width="800" height="900" fill="url(#sky)" opacity="0" />
</svg>
